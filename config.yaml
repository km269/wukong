# =============================================================================
# Wukong Configuration — Full Template
# =============================================================================
#
# Loading priority (high to low):
#   1. CLI flags (--provider, --model, --temperature, --max-tokens, --config)
#   2. Env vars (WUKONG_ prefix, e.g. WUKONG_DEFAULT_PROVIDER)
#   3. --config CLI-specified file
#   4. ./config.yaml (current directory)
#   5. ~/.config/wukong/config.yaml
#   6. /etc/wukong/config.yaml (non-Windows)
#   7. Built-in defaults (internal/config/defaults.go)
#
# Env var expansion: ${ENV_VAR} and ${VAR:-default} syntax supported
# in the following fields:
#   - providers[].api_key, base_url, model
#   - summon.a2a_remotes[].api_key, jwt_secret, oauth_client_secret
#   - gateway.feishu.app_secret, encrypt_key, verification_token
#   - observability.langfuse_public_key, langfuse_secret_key
#   - artifact.cos_secret_id, cos_secret_key
#   - acp_server.security.auth.api_key
#   - cortex.embedding_api_key, embedding_base_url, embedding_model
#   - cortex.reranker_api_key, reranker_base_url, reranker_model
#   - cortex.vertical_routing.github_api_key
#   - memoryflow.planner_model, memoryflow.extractor_model
#   - graphflow.extractor_model
#   - dify.api_secret
#   - session.redis_url
#   - browser.search.searxng.url, searxng.api_key
#   - browser.search.tavily.api_key
#   - browser.search.google.api_key, google.cse_id
#   - browser.search.bing.api_key
#
# Unresolved ${VAR} (no :-default, VAR unset) is surfaced as a
# startup warning so typos like ${OEPNAI_API_KEY} are visible.
#
# Path conventions:
#   - .wukong/      — Runtime data (apps, cache, skills, visuals, okf, evals)
#   - ~/.config/    — User-level config (prompts, project data)
#   - wukong.db     — Single SQLite WAL file shared by all storage subsystems
# =============================================================================

# ===========================================================================
# A. Global Settings
# ===========================================================================
log_level: "info"                    # debug | info | warn | error
default_provider: "vllm"         # must match a name in providers[]
lightweight_provider: "vllm"     # background tasks (empty = default_provider)
lightweight_model: "deepseek-v4-flash-0731"  # background lightweight model name

# ===========================================================================
# B. Providers — LLM backends
# ===========================================================================
# Supported types: openai | anthropic | google | deepseek | ollama | lmstudio | vllm | acp
# - openai-compatible cloud providers (siliconflow/openrouter/groq/etc.) use type: "openai"
# - local inference servers (vllm/ollama/lmstudio) need no api_key
# api_key supports ${ENV_VAR} expansion for secrets management.
providers:
  - name: "openai"
    type: "openai"
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o"

  - name: "anthropic"
    type: "anthropic"
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "https://api.anthropic.com/v1"
    model: "claude-sonnet-4-20250514"

  - name: "google"
    type: "google"
    api_key: "${GOOGLE_API_KEY}"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    model: "gemini-2.0-flash"

  - name: "deepseek"
    type: "deepseek"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com"
    model: "deepseek-chat"

  - name: "vllm"
    type: "vllm"
    api_key: ""                       # vllm 不需要 api_key；留空即可（代码已跳过校验）
    base_url: "http://192.168.50.115:8888/v1"   # 必须带 /v1 后缀；vllm OpenAI 兼容端点
    model: "deepseek-v4-flash-0731" #"claude-opus-4-8" #
    context_window: 131072          # match vllm serve --max-model-len; prevents 400 overflow

  - name: "ollama"
    type: "ollama"
    api_key: "ollama"
    base_url: "http://localhost:11434/v1"
    model: "llama3"

  - name: "lmstudio"
    type: "lmstudio"
    api_key: "lmstudio"
    base_url: "${LMSTUDIO_BASE_URL:-http://localhost:1234/v1}"
    model: "${LMSTUDIO_MODEL:-google/gemma-4-26b-a4b}"

  # --- OpenAI-compatible cloud providers (type: openai) ---
  - name: "siliconflow"
    type: "openai"
    api_key: "${SILICONFLOW_API_KEY}"
    base_url: "https://api.siliconflow.cn/v1"
    model: "Qwen/Qwen2.5-72B-Instruct"

  - name: "openrouter"
    type: "openai"
    api_key: "${OPENROUTER_API_KEY}"
    base_url: "https://openrouter.ai/api/v1"
    model: "anthropic/claude-sonnet-4"

  - name: "groq"
    type: "openai"
    api_key: "${GROQ_API_KEY}"
    base_url: "https://api.groq.com/openai/v1"
    model: "llama-3.3-70b-versatile"

  - name: "moonshot"
    type: "openai"
    api_key: "${MOONSHOT_API_KEY}"
    base_url: "https://api.moonshot.cn/v1"
    model: "moonshot-v1-32k"

  - name: "zhipu"
    type: "openai"
    api_key: "${ZHIPU_API_KEY}"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    model: "glm-4-plus"

  - name: "acp-coder"
    type: "acp"
    agent_url: "http://localhost:4000"
    model: "acp-default"

# ===========================================================================
# C. Agent — Core behaviour & generation parameters
# ===========================================================================
agent:
  max_llm_calls: 50                  # 0 = unlimited
  max_tool_iterations: 50
  max_run_duration: "3600s"          # wall-clock time limit (1h, 本地大模型复杂任务)
  tool_call_timeout: "120s"          # per-tool-call deadline; bounds a single hung/slow tool so it can't exhaust the run budget

  parallel_tools: true               # concurrent independent tool calls
  streaming: true                    # real-time token streaming in TUI
  temperature: 0.7                   # [0.0, 2.0]
  max_tokens: 4096

  tool_retry_enabled: true
  tool_retry_max_attempts: 3
  tool_retry_initial_wait: "1s"
  tool_retry_backoff_factor: 2.0
  enable_post_tool_prompt: true

  planner: ""                        # "" (disabled) | "builtin" | "react"
  # reasoning_effort: "medium"       # low | medium | high (builtin planner)
  # thinking_enabled: true
  # thinking_tokens: 4096

  tool_search_enabled: true
  tool_search_max_tools: 20

  context_compaction: true
  context_compaction_tool_result_max_tokens: 1024
  context_compaction_oversized_max_tokens: 8192
  context_compaction_keep_recent: 1

  session_recall_enabled: false
  session_recall_limit: 5

  json_repair_enabled: false

  agent_tools_enabled: false
  agent_tools_stream: false

  system_prompt_dir: "~/.config/wukong/prompts/"
  recipe_dir: ".wukong/recipes/"
  recipe_enabled: true

# ===========================================================================
# D. Security — Tool execution safety & access control
# ===========================================================================
security:
  permission_mode: "smart"           # auto | smart | manual | chat_only
  require_approval: false            # legacy; prefer permission_mode
  malware_scan_enabled: true
  block_dangerous_commands: true
  blocked_commands:
    - "rm -rf /"
    - "dd if=/dev/zero"
    - "mkfs."
    - "> /dev/sda"
    - "fork bomb"
  default_timeout: "30s"
  max_timeout: "300s"
  allowlist: []
  denylist: []
  guardrail_enabled: false
  ignore_file_enabled: true
  ignore_file: ".wukongignore"
  # Process-level sandbox for shell execution (developer toolset).
  # Limits cap CPU / memory / file-size / process-count per command;
  # kill_on_parent_exit binds child processes to wukong's lifetime.
  # Zero values mean "unlimited" — leave commented defaults in place
  # for legacy behavior. Enabling requires platform support:
  #   Windows: Job Object (no admin needed; low-integrity label is
  #            best-effort and decoupled from limits).
  #   Linux:   setrlimit + Landlock (kernel 5.13+).
  #   macOS:   sandbox-exec (limits not enforced — no-op).
  sandbox:
    kill_on_parent_exit: false
    limits:
      max_cpu_seconds: 0      # Windows: JOB_OBJECT_LIMIT_PROCESS_TIME; Linux: RLIMIT_CPU
      max_memory_bytes: 0     # Windows: JOB_OBJECT_LIMIT_PROCESS_MEMORY; Linux: RLIMIT_AS
      max_file_bytes: 0       # Linux only (RLIMIT_FSIZE); ignored on Windows
      max_processes: 0        # Windows: JOB_OBJECT_LIMIT_ACTIVE_PROCESS; Linux: RLIMIT_NPROC

# ===========================================================================
# E. Storage — SQLite-backed persistence layer
# ===========================================================================
# All subsystems share the same SQLite WAL file (wukong.db) by default.

session:
  backend: "sqlite"                  # sqlite | memory | redis
  db_path: "wukong.db"
  event_limit: 500
  ttl: "0h"
  enable_summary: true
  summary_trigger: 50
  # 记录模型实际看到的消息（含上下文富化后的），强制 "model-visible means logged" 不变式
  enable_model_event_log: true
  redis_url: "${REDIS_URL:-}"

memory:
  backend: "sqlite"
  db_path: "wukong.db"
  max_memories: 100
  auto_extract: true
  extract_timeout: "300s"
  extractor_provider: ""
  extractor_model: ""
  extractor_prompt: ""

  recency_weight: 0.4
  reference_weight: 0.3
  importance_weight: 0.2
  length_weight: 0.1
  dynamic_ttl: true

  enable_smart_cleanup: true
  cleanup_trigger_threshold: 0.8
  cleanup_target_threshold: 0.6
  memory_ttl: "720h"

todo:
  backend: "sqlite"
  db_path: "wukong.db"
  enable_native_todo: true
  enable_enforcer: true

recall:
  enabled: true
  backend: "sqlite"
  db_path: "wukong.db"
  max_results: 10
  max_messages_per_session: 200
  search_mode: "fts5"

# ===========================================================================
# F. CortexDB Memory Stack — Vector + FTS5 + Knowledge Graph
# ===========================================================================
cortex:
  enabled: true
  db_path: "wukong.db"
  max_results: 10
  max_messages_per_session: 200
  embedding_base_url: "${EMBEDDING_BASE_URL:-http://192.168.50.97:8082/v1}"
  embedding_api_key: "${EMBEDDING_API_KEY:-vllm}"
  embedding_model: "${EMBEDDING_MODEL:-bge-m3-Q8_0}"
  # Cross-Encoder reranker (optional; empty = disabled)
  # Reuses embedding_base_url/api_key when reranker_* not set.
  reranker_base_url: "${RERANKER_BASE_URL:-http://192.168.50.97:8083}"
  reranker_api_key: "${RERANKER_API_KEY:-vllm}"
  reranker_model: "${RERANKER_MODEL:-bge-reranker-v2-m3-FP16}"
  # Search strategy tuning (optional)
  search_strategy:
    recall_mode: "hybrid"          # lexical | vector | hybrid
    dense_weight: 0.7              # vector weight [0,1]
    text_weight: 0.3               # lexical weight [0,1]
    fts5_pool_size: 50             # candidate pool before re-rank
    max_retrieved_num: 10          # final Top-K
    fusion_method: "rrf"           # weighted | rrf (RRF recommended)
    rrf_k: 60                      # RRF smoothing constant
    reranker_enabled: false        # enable Cross-Encoder reranking
    reranker_top_n: 20             # candidates to send to reranker
    mmr_enabled: false             # enable MMR diversity in top-K
    mmr_lambda: 0.7                # MMR trade-off [0,1]: 1=relevance, 0=diversity

  # Vertical domain search routing (optional)
  # Routes queries to specialised backends (arXiv, GitHub, Wikipedia,
  # Reddit) based on detected intent, augmenting local retrieval.
  vertical_routing:
    enabled: false                 # enable query-intent routing
    top_n: 5                       # max results per backend
    timeout: "10s"                 # per-backend deadline
    merge_mode: "prepend"          # prepend | append | replace
    github_api_key: "${GITHUB_API_KEY:-}"

  # Semantic chunking for RAG ingestion (optional, enabled by default)
  # Splits long messages into coherent chunks before embedding.
  chunking:
    enabled: true                  # enable semantic chunking
    max_size: 1200                 # max runes per chunk
    overlap: 200                   # overlap runes between chunks
    min_size: 100                  # merge chunks smaller than this

memoryflow:
  enabled: true
  db_path: "wukong.db"
  namespace: "assistant"
  embedding_dimensions: 0
  planner_model: "${VLLM_MODEL:-qwen3.6-27b}"
  extractor_model: "${VLLM_MODEL:-qwen3.6-27b}"

graphflow:
  enabled: true
  db_path: "wukong.db"
  max_chars_per_doc: 8000
  auto_extract: true
  extractor_model: "${VLLM_MODEL:-qwen3.6-27b}"

importflow:
  enabled: true
  db_path: "wukong.db"

# ===========================================================================
# G. Context Management — Token optimization & revision
# ===========================================================================
revision:
  enabled: true
  revision_provider: ""
  revision_model: ""
  enable_llm_summarize: true
  summary_cooldown: "120s"
  summary_timeout: "30s"
  max_command_output: 8000
  enable_semantic_search: false
  search_strategy: "include_all"
  max_context_tokens: 24000         #保守上限。vllm qwen3.6-27b n_ctx=32768，
                                    #留 8000+ buffer 给单次 user input + tool results。
                                    #ContextRevisionEngine 异步触发，需预留暴涨空间，
                                    #否则单次输入会让 prompt 突破 model n_ctx 触发 400。
                                    #可被 providers[].context_window 进一步收紧。
  trim_ratio: 0.3

# ===========================================================================
# H. Feature Tools
# ===========================================================================
browser:
  enabled: true
  browser_type: "chromium"
  backend: "rod"                     # chromedp | rod — browser automation backend
  headless: true
  browser_path: ""
  stealth: true
  cache_dir: ".wukong/cache"
  max_download_size: 104857600
  timeout: "60s"
  viewport_width: 1280
  viewport_height: 720
  scroll: false
  control_url: ""
  workers: 4
  profile_dir: ""
  proxy:
    enabled: false
    pool: []
    rotate_every: 10
  search:
    duckduckgo:
      enabled: false
      url: "https://api.duckduckgo.com/"
    searxng:
      enabled: true
      url: "${SEARXNG_URL:-http://43.167.226.121:8080/}"
      api_key: "${SEARXNG_API_KEY:-}"
    tavily:
      enabled: false
      api_key: "${TAVILY_API_KEY:-}"
    google:
      enabled: false
      api_key: "${GOOGLE_API_KEY}"
      cse_id: "${GOOGLE_CSE_ID}"
    bing:
      enabled: false
      api_key: "${BING_API_KEY}"

visualiser:
  enabled: true
  output_dir: ".wukong/visuals"
  max_width: 1200
  max_height: 800

tutorial:
  enabled: true
  language: "zh"

top_of_mind:
  enabled: true
  instruction_file: ".wukong/instructions.md"
  max_length: 2000

code_mode:
  enabled: true
  timeout: "10s"
  max_memory_mb: 128

apps:
  enabled: true
  app_dir: ".wukong/apps"

  clone:
    max_pages: 0
    max_depth: 0
    traversal: "bfs"
    subdomains: false
    scope_prefix: ""
    workers: 4
    asset_workers: 8
    timeout: 60                    # seconds — page navigation deadline
    render_timeout: 30             # seconds — single render wait
    settle: 1500                   # milliseconds — network idle wait
    scroll: false
    user_agent: ""
    asset_same_domain: true
    max_asset_bytes: 52428800
    respect_robots: true
    crawl_delay: 0                 # milliseconds — delay between requests
    rate_limit_whitelist: []       # hosts exempt from asset rate limiting (trusted CDN/intranet/dev servers; skip per-host token bucket + 429/503 slowdown; portless entry matches any port)
    rate_limit_ip_segment: true    # propagate 429/503 penalties across hosts sharing an IP segment (CDN aliases); DNS consulted only after a penalty
    rate_limit_ip_prefix_v4: 24    # IPv4 segment prefix length
    rate_limit_ip_prefix_v6: 64    # IPv6 segment prefix length
    no_sitemap: false
    dedup_content: true
    mobile_readable: true
    enable_resume: true
    persist: true
    incremental: true
    cache_max_age: 86400           # seconds — cache TTL
    headless: true
    stealth: true
    chrome_profile: ".wukong/chrome/profile"
    chrome_path: ""
    antibot_enabled: true
    antibot_auto_escalate: true
    cookie_file: ""
    browser_backend: "rod"
    proxy_enabled: false
    proxy_pool: []
    proxy_rotate_every: 10
    # --- TLS (克隆/下载的证书校验策略) ---
    # insecure_tls: 设为 true 才跳过证书校验（仅适用于内网/.mil/.gov 等无法
    #               链到公共根的证书场景）。默认 false = 严格校验（安全）。
    insecure_tls: false
    # tls_ca_cert_path: 指向 PEM 格式 CA 证书包（如 DoD 根证书包），用于在保持
    #                 严格校验的同时信任 .mil/.gov 站点证书。留空 = 用系统根。
    tls_ca_cert_path: ""

  pack:
    compress: true
    incremental: false
    language: "eng"
    creator: "Wukong"
    format: "html"

# ===========================================================================
# I. Extensions — MCP external servers
# ===========================================================================
extensions: []

# ===========================================================================
# J. Service Endpoints — Multi-protocol server ports
# ===========================================================================
a2a_server:
  enabled: true
  address: ":9090"
  agent_name: "wukong"
  agent_description: "Wukong AI Agent — A2A endpoint"

agui:
  enabled: true
  address: ":8080"
  path: "/agui"

acp_server:
  enabled: true
  address: ":9091"
  path: "/acp"
  enable_streaming: true
  # 认证必须嵌套在 security.auth.* 下，顶层 auth_type/api_key 会被
  # Viper 静默丢弃（无 mapstructure tag），导致认证形同虚设。
  security:
    auth:
      type: ""                          # "" | "api_key" | "jwt"
      api_key: "${ACP_API_KEY:-}"       # 与 expandSecrets 中 cfg.ACPServer.Security.Auth.APIKey 对应

acp_mcp:
  enabled: true
  address: ":3400"
  path: "/mcp"

# 独立 MCP 服务器（expose agent 工具为 MCP tools）
# security 与 acp_server.security 结构相同；留空 type 则不启用认证
mcp_server:
  enabled: false
  address: ":3401"
  security:
    auth:
      type: ""                          # "" | "api_key" | "jwt"
      api_key: "${MCP_API_KEY:-}"

gateway:
  enabled: false
  default_timeout: "900s"
  max_concurrent_sessions: 100
  message_dedup_ttl: "5m"
  rate_limit_per_user: 20
  rate_limit_window: "60s"

  feishu:
    enabled: false
    app_id: "cli_aa98378746f8dcd7"
    app_secret: "${FEISHU_APP_SECRET}"
    api_base: "https://open.feishu.cn/open-apis"
    encrypt_key: "${FEISHU_ENCRYPT_KEY}"
    verification_token: "${FEISHU_VERIFICATION_TOKEN}"
    stream_card_enabled: true
    stream_card_update_interval: "500ms"
    max_message_length: 4096
    enable_file_receive: true

# ===========================================================================
# K. Agent-to-Agent Communication
# ===========================================================================
# summon — Sub-agent delegation subsystem (internal/summon/delegate.go).
# Loads .md delegate definitions from delegates_dir, wraps Skill agents
# and remote A2A agents as callable tools for the main agent.
summon:
  enabled: true                     # false = skip sub-agent delegation entirely
  delegates_dir: ".wukong/skills"   # 子代理委派定义目录（.md 文件，每个成为一个 Delegate）
  max_concurrent: 5                 # max parallel sub-agent executions (>=0)
  a2a_remotes: []                   # remote A2A agents; OAuth2 ones get auto token-refresh

# anp — Agent Network Protocol stack. Implemented in internal/summon/
# (meta_protocol.go, e2ee.go) but exposed as an independent config block.
# These flags drive the summon package's MetaProtocol + E2EEMessenger.
anp:
  enabled: false
  port: 9092
  discovery_enabled: true
  meta_protocol_enabled: true       # drives summon.NewMetaProtocol
  http_sign_enabled: true
  e2ee_enabled: true                # drives summon.NewE2EEMessenger
  a2a_enabled: true
  mcp_enabled: true
  agui_enabled: true

ard:
  enabled: false
  registry_url: ""
  catalog_path: ".wukong/ard/catalog.json"
  publish_enabled: false
  publish_port: 0

dify:
  enabled: false
  agent_name: "dify"
  enable_streaming: false
  timeout: "120s"

# ===========================================================================
# L. Knowledge & Skill Management
# ===========================================================================
knowledge:
  enabled: true
  embedder_provider: ""                   # 留空 → 回退到 cortex.embedding_* (端口 8082)，再回退到 default_provider
  embedder_model: "bge-m3-Q8_0"
  vector_store: "inmemory"
  max_results: 5
  enable_source_sync: false
  search_tool_name: "knowledge_search"

okf:
  enabled: true
  bundle_dir: ".wukong/okf"
  injector_enabled: false
  enrichment_enabled: false
  auto_export: false
  register_in_ard: false

skill:
  enabled: true
  skills_dir: ".wukong/skills"

evolution:
  enabled: true
  auto_patch: false
  analysis_provider: ""
  analysis_model: ""
  min_confidence: 0.7
  cooldown_period: "30m"
  max_patches_per_day: 10
  max_versions_kept: 10
  max_patch_size: 8192
  analysis_timeout: "60s"
  export_json: false

# ===========================================================================
# M. Agent Orchestration
# ===========================================================================
workflow:
  mode: "single"
  max_iterations: 10
  cycle_mode: "default"
  sub_agents: []
  team_members: []
  claude_code_bin: ""
  codex_bin: ""

# ===========================================================================
# N. Observability & Evaluation
# ===========================================================================
telemetry:
  enabled: false
  exporter_type: "console"
  endpoint: "localhost:4317"
  service_name: "wukong"
  service_version: "1.0.0"
  environment: "development"
  sample_rate: 1.0

observability:
  langfuse_enabled: false

eval:
  enabled: false
  evalset_path: ".wukong/evals/default.evalset.json"
  results_path: ".wukong/evals/results.json"

artifact:
  backend: "inmemory"

# ===========================================================================
# O. Project Directory
# ===========================================================================
project_dir: "~/.config/wukong/"